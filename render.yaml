services:
  - type: web
    name: super-sheldon-api
    runtime: node
    plan: free
    rootDir: .
    # Plain `playwright install chromium` — no --with-deps, no path override.
    # This is what ptm-agent uses on Render and it works:
    #   - Render's runtime image already has the OS libs Chromium needs
    #     (libatk, libnss, etc.), so --with-deps is unnecessary and was
    #     failing silently because it tries to apt-get without proper
    #     privileges, which then prevented the actual browser download.
    #   - Render preserves ~/.cache between build and runtime, so the
    #     default install location is fine — no PLAYWRIGHT_BROWSERS_PATH
    #     dance required.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server exec playwright install chromium && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_DEMO
        value: "true"
      # Wise/Mongo — teacher + student rosters and Wise-keyed session lookups
      - key: MONGO_CONNECTION_STRING
        sync: false
      - key: MONGO_DATABASE_NAME
        value: "pre-sales-crm"
      # Azure OpenAI — post-session AI report generation
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        value: "gpt-5.1"
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-12-01-preview"
      # PDF render + n8n email delivery
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: N8N_EMAIL_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "ClassPulse AI"

  - type: web
    name: super-sheldon-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter @workspace/super-sheldon run build
    staticPublishPath: artifacts/super-sheldon/dist/public
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
