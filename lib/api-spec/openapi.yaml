openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ClassPulse AI — Real-time classroom intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: classes
    description: Class management
  - name: sessions
    description: AI monitoring sessions
  - name: reports
    description: AI analysis reports
  - name: dashboard
    description: Dashboard statistics
  - name: students
    description: Student records (ClassPulse)
  - name: parents
    description: Parent records & parent-facing reports
  - name: churn
    description: Churn-risk predictions
  - name: interventions
    description: Class Rescue AI suggestions
  - name: admin
    description: Internal team / admin analytics
  - name: classpulse
    description: ClassPulse real-time AI signals

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated teacher
      responses:
        "200":
          description: Current teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the current teacher's profile (name, subject, avatarUrl)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /teachers/select:
    get:
      operationId: listTeachersForSelect
      tags: [auth]
      summary: Public list of teachers for the picker screen
      responses:
        "200":
          description: Teacher picker list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherOption"

  /auth/select-teacher:
    post:
      operationId: selectTeacher
      tags: [auth]
      summary: Issue an auth token by teacher id (no password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectTeacherBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "404":
          description: Teacher not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin-login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin password login — returns an admin-role token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Invalid admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/public-list:
    get:
      operationId: listStudentsForSelect
      tags: [auth]
      summary: Public list of students for the picker screen
      responses:
        "200":
          description: Student picker list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentOption"

  /auth/select-student:
    post:
      operationId: selectStudent
      tags: [auth]
      summary: Issue a student-role token by student id (no password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectStudentBody"
      responses:
        "200":
          description: Student login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentLoginResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes for the current teacher (paginated + filterable)
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, completed, cancelled, active]
        - name: q
          in: query
          required: false
          description: Search by student name
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClasses"

  /classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a single class by ID
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/start:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start an AI monitoring session for a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionBody"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/start-custom:
    post:
      operationId: startCustomSession
      tags: [sessions]
      summary: Create an ad-hoc class on the fly and start a monitoring session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCustomSessionBody"
      responses:
        "201":
          description: Custom session started — returns both the new session and the created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessionResponse"

  /sessions/active:
    get:
      operationId: getActiveSession
      tags: [sessions]
      summary: Get the current active monitoring session
      responses:
        "200":
          description: Active session or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessionResponse"

  /sessions/{sessionId}/finish:
    post:
      operationId: finishSession
      tags: [sessions]
      summary: Finish monitoring and generate AI report
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List all AI reports for the current teacher
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{reportId}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a single AI report by ID
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{reportId}/pdf:
    post:
      operationId: renderReportPdf
      tags: [reports]
      summary: Render the report to PDF and store it in Supabase
      description: |
        Drives a headless Chromium against the frontend `/reports/{id}/print`
        route, captures a single-page PDF and uploads it. Returns the public
        URL. Idempotent — re-rendering replaces the prior file at the same path.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF rendered and stored
          content:
            application/json:
              schema:
                type: object
                required: [pdfUrl]
                properties:
                  pdfUrl:
                    type: string
                    format: uri
        "500":
          description: Render or upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{reportId}/send:
    post:
      operationId: sendReportEmail
      tags: [reports]
      summary: Render PDF if needed and email it to the teacher via n8n
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientEmail:
                  type: string
                  format: email
                  description: Override the teacher's on-file email
      responses:
        "200":
          description: Delivery dispatched
          content:
            application/json:
              schema:
                type: object
                required: [status, pdfUrl]
                properties:
                  status:
                    type: string
                    enum: [sent, skipped, failed]
                  recipient:
                    type: string
                    nullable: true
                  pdfUrl:
                    type: string
                    format: uri
                  error:
                    type: string
                    nullable: true
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/weekly-performance:
    get:
      operationId: getWeeklyPerformance
      tags: [dashboard]
      summary: Get weekly teaching performance chart data
      responses:
        "200":
          description: Weekly performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyPerformancePoint"

  # ──────────────────────────────────────────────────────────────────────────
  # ClassPulse AI: students, parents, churn, interventions, admin
  # ──────────────────────────────────────────────────────────────────────────

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students for the current teacher
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a single student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/{studentId}/parent-report:
    get:
      operationId: getParentReport
      tags: [parents]
      summary: Get the parent-facing summary for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parent-facing report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentReport"

  /students/{studentId}/churn:
    get:
      operationId: getStudentChurn
      tags: [churn]
      summary: Latest churn-risk prediction for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Churn prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurnPrediction"

  /churn/alerts:
    get:
      operationId: listChurnAlerts
      tags: [churn]
      summary: All high-risk churn alerts visible to the current teacher
      responses:
        "200":
          description: Churn alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChurnAlert"

  /sessions/{sessionId}/transcript:
    post:
      operationId: appendTranscript
      tags: [classpulse]
      summary: Append an utterance to the live transcript log
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendTranscriptBody"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"

  /sessions/{sessionId}/quiz-event:
    post:
      operationId: recordQuizEvent
      tags: [classpulse]
      summary: Record a quiz response captured during a live session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordQuizEventBody"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizEvent"

  /sessions/{sessionId}/live-signals:
    get:
      operationId: getLiveSignals
      tags: [classpulse]
      summary: Live engagement, confusion, and mood signals for an active session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live signal snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSignals"

  /ai/confusion:
    post:
      operationId: detectConfusion
      tags: [classpulse]
      summary: Real-time confusion detection for a transcript window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectConfusionBody"
      responses:
        "200":
          description: Confusion signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfusionSignal"

  /interventions/{sessionId}:
    get:
      operationId: listInterventions
      tags: [interventions]
      summary: List Class Rescue AI suggestions for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interventions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intervention"

  /interventions:
    post:
      operationId: createIntervention
      tags: [interventions]
      summary: Record an intervention applied or dismissed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterventionBody"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervention"

  /admin/teachers:
    get:
      operationId: adminListTeachers
      tags: [admin]
      summary: Internal team view of all teachers and their performance
      responses:
        "200":
          description: Teachers with KPIs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherKpi"

  /admin/students:
    get:
      operationId: adminListStudents
      tags: [admin]
      summary: Internal team view of all students with engagement & churn snapshot
      responses:
        "200":
          description: Students with KPIs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentKpi"

  /admin/retention:
    get:
      operationId: adminRetention
      tags: [admin]
      summary: Aggregate retention analytics
      responses:
        "200":
          description: Retention snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionSnapshot"

  /admin/delivery-logs:
    get:
      operationId: adminDeliveryLogs
      tags: [admin]
      summary: List recent email-delivery audit rows (admin only)
      responses:
        "200":
          description: Delivery log entries (most recent first, capped at 200)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryLogEntry"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum: [teacher, admin, student]
        teacher:
          $ref: "#/components/schemas/Teacher"
      required: [token, teacher]

    SelectTeacherBody:
      type: object
      properties:
        teacherId:
          # Mongo Wise ID (string). Server still accepts legacy ints for back-compat.
          type: string
      required: [teacherId]

    SelectStudentBody:
      type: object
      properties:
        studentId:
          type: string
      required: [studentId]

    AdminLoginBody:
      type: object
      properties:
        password:
          type: string
          description: Ignored in preview deployments — kept for backward compatibility.
      required: []

    AdminLoginResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum: [admin]
        admin:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
          required: [name, email]
      required: [token, role, admin]

    StudentLoginResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum: [student]
        student:
          $ref: "#/components/schemas/StudentOption"
      required: [token, role, student]

    StudentOption:
      type: object
      properties:
        id:
          # Mongo Wise student ID (24-char hex string)
          type: string
        name:
          type: string
        subject:
          type: string
          nullable: true
        grade:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required: [id, name]

    UpdateMeBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          minLength: 1
          maxLength: 120
        avatarUrl:
          type: string
          nullable: true

    TeacherOption:
      type: object
      properties:
        id:
          # Mongo Wise teacher ID (24-char hex string)
          type: string
        name:
          type: string
        subject:
          type: string
        avatarUrl:
          type: string
          nullable: true
        totalClasses:
          type: integer
        email:
          type: string
          nullable: true
      required: [id, name, subject, totalClasses]

    Teacher:
      type: object
      properties:
        id:
          # Mongo Wise teacher ID (string) for Wise-sourced teachers;
          # numeric id (still serialized as string) for legacy Supabase rows.
          type: string
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        avatarUrl:
          type: string
          nullable: true
        totalClasses:
          type: integer
        avgScore:
          type: number
        role:
          type: string
          enum: [teacher, admin, student]
        grade:
          type: string
          nullable: true
        primaryTeacherId:
          type: integer
          nullable: true
      required: [id, name, email, subject, totalClasses, avgScore]

    Class:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: integer
        studentName:
          type: string
        subject:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        platform:
          type: string
          enum: [zoom, google_meet, teams]
        meetingUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [upcoming, in_progress, completed, cancelled]
        grade:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required: [id, teacherId, studentName, subject, scheduledAt, durationMinutes, platform, status]

    PaginatedClasses:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Class"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
      required: [items, total, page, limit, hasMore]

    StartSessionBody:
      type: object
      properties:
        classId:
          type: integer
      required: [classId]

    StartCustomSessionBody:
      type: object
      properties:
        studentName:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          minLength: 1
          maxLength: 120
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
        grade:
          type: string
          maxLength: 40
        platform:
          type: string
          enum: [zoom, google_meet, teams]
      required: [studentName, subject]

    Session:
      type: object
      properties:
        id:
          type: integer
        classId:
          type: integer
        teacherId:
          type: integer
        startedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, finished]
      required: [id, classId, teacherId, startedAt, status]

    ActiveSessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
          nullable: true
        class:
          $ref: "#/components/schemas/Class"
          nullable: true
      required: [session, class]

    Report:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        classId:
          type: integer
        teacherId:
          type: integer
        overallScore:
          type: number
        engagementScore:
          type: number
        voiceClarityScore:
          type: number
        interactionScore:
          type: number
        noiseLevel:
          type: number
        speakingConfidence:
          type: number
        deadAirSeconds:
          type: number
        internetStability:
          type: number
        understandingScore:
          type: number
          nullable: true
        satisfactionScore:
          type: number
          nullable: true
        teacherCompatibilityScore:
          type: number
          nullable: true
        churnRiskScore:
          type: number
          nullable: true
        aiSummary:
          type: string
        suggestions:
          type: array
          items:
            type: string
        highlights:
          type: array
          items:
            type: string
        improvementAreas:
          type: array
          items:
            type: string
        timelineData:
